[package]
name = "pangraphx-core"
version = "0.1.0"
edition = "2024"
description = "Core library for PanGraphX: a toolkit for genome graph loading and format conversion."
license = "MIT"
repository = "https://github.com/samuelburger27/PanGraphX"

[dependencies]
clap = { version = "4", features = ["derive"] }
gbwt = "0.3.1"
gfa = "0.10.1"
log = "0.4.28"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3"