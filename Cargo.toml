[workspace]
members = [
    "pangraphx-core",
    "pangraphx-cli"
]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Fully optimized build for benchmarks and distribution (`cargo build --profile dist`).
# Kept out of `release` because fat LTO with one codegen unit makes builds slow.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
