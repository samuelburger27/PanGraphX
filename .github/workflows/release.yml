name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-system-deps
      - name: cargo publish --dry-run
        run: cargo publish -p pangraphx-core --dry-run
      - name: cargo publish
        run: cargo publish -p pangraphx-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf
      - name: Install odgi system dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/setup-system-deps
      - name: cargo build (with odgi)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release -p pangraphx-cli --target ${{ matrix.target }} --features pangraphx-core/odgi
      - name: cargo build
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release -p pangraphx-cli --target ${{ matrix.target }}
      - name: Prepare artifact
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/pangraphx-cli"
          ext=""
          if [ -f "$bin.exe" ]; then ext=".exe"; fi
          mv "$bin$ext" "pangraphx-cli-${{ matrix.target }}$ext"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pangraphx-cli-${{ matrix.target }}
          path: pangraphx-cli-${{ matrix.target }}*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-crates-io, build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: pangraphx-cli-*
          merge-multiple: true
          path: dist
      - name: Rename binaries
        shell: bash
        run: |
          for f in dist/pangraphx-cli-*; do
            [ -f "$f" ] || continue
            case "$f" in
              *x86_64-unknown-linux-gnu) mv "$f" "${f%x86_64-unknown-linux-gnu}linux-x86_64" ;;
              *aarch64-apple-darwin) mv "$f" "${f%aarch64-apple-darwin}macos-aarch64" ;;
              *) ;;
            esac
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
