name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-run so the security audit catches newly disclosed advisories
    # even when there are no new commits. Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

# Drop superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-system-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-system-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all-targets --all-features

  cross-validate:
    name: Cross-validate (vg, odgi)
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping when vg or odgi is missing.
      PANGRAPHX_REQUIRE_EXTERNAL: "1"
      TOOLS_PREFIX: ${{ github.workspace }}/../xtools
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-system-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache vg and odgi
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLS_PREFIX }}
          key: xtools-${{ runner.os }}-${{ hashFiles('utils/install_external_tools.sh') }}
      - name: Install vg and odgi (pinned)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends cmake zlib1g-dev libjemalloc-dev python3-dev
          utils/install_external_tools.sh "$TOOLS_PREFIX"
      - name: Add tools to PATH
        run: |
          echo "$TOOLS_PREFIX/bin" >> "$GITHUB_PATH"
          "$TOOLS_PREFIX/bin/vg" version | head -1
          "$TOOLS_PREFIX/bin/odgi" version
      - name: Cross-validation and golden files
        run: cargo test --release -p pangraphx-core --test cross_validation --test test_reference_files
      - name: Golden files still match the pinned tools
        run: |
          utils/generate_test_files.sh --reference --out "$RUNNER_TEMP/reference"
          PANGRAPHX_REFERENCE_DIR="$RUNNER_TEMP/reference" \
            cargo test --release -p pangraphx-core --test test_reference_files

  bench:
    name: Benchmarks (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-system-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build the criterion benches in the optimized bench profile so they can't
      # silently rot. Full benchmark runs stay manual (too noisy/slow for CI).
      - name: cargo bench --no-run
        run: cargo bench --all-features --no-run

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-system-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
