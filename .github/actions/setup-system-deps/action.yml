name: Setup system dependencies
description: >-
  Install the native build dependencies PanGraphX needs: protobuf-compiler
  (prost-build) and a C toolchain.
runs:
  using: composite
  steps:
    - name: apt-get install
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          protobuf-compiler
