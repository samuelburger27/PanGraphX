[package]
name = "pangraphx-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool based on PanGraphX: converting and inspecting genome graphs."
license = "MIT"

[lints]
workspace = true

[features]
default = []
# mimalloc is ~10-20 % faster on large graphs but raises peak RSS by ~50 %
# (1.27 -> 1.91 GiB loading chr22), so it is opt-in.
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
simplelog = "0.12"
log = "0.4.28"
pangraphx-core = { path = "../pangraphx-core" }
env_logger = "0.11.8"
textwrap = "0.16.2"
colored = "3.1.1"
mimalloc = { version = "0.1.52", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
